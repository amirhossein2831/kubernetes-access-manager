input_path: defenition/input.json
policy_path: configs/sensitivity.json
poll:
  interval: 5m
  timeout: 2m
kubernetes:
  kubeconfig: /run/secrets/kubeconfig
  request_timeout: 20s
  attempts: 3
  backoff_min: 500ms
  backoff_max: 5s
  qps: 5
  burst: 10
  page_size: 500
http:
  addr: ':8080'
  shutdown_timeout: 10s
output:
  path: /var/log/access-monitor/events.jsonl
  max_bytes: 20971520
  backups: 10
log:
  level: info
